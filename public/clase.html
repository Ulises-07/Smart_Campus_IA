<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clase — Smart Campus IA</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="contenido">
    <a href="/inicio.html" style="color:var(--color-text-muted);text-decoration:none;font-size:var(--texto-sm)">← Volver</a>
    <h1 id="titulo" style="margin:.5rem 0 .25rem;font-size:var(--texto-2xl);color:var(--color-primary)">Clase</h1>
    <p id="subtitulo" style="color:var(--color-text-muted);margin:0 0 1.5rem"></p>

    <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
      <button class="tab boton boton-secundario activa" data-tab="notas" style="width:auto">Notas</button>
      <button class="tab boton boton-secundario" data-tab="asistencia" style="width:auto">Asistencia</button>
      <button class="tab boton boton-secundario" data-tab="material" style="width:auto">Material</button>
      <div style="flex:1"></div>
      <select id="periodo" class="control" style="width:auto"></select>
    </div>

    <div id="panel-notas"></div>
    <div id="panel-asistencia" hidden></div>
    <div id="panel-material" hidden></div>
  </main>

  <dialog id="dlg" class="dialogo"></dialog>
  <script type="module" src="/js/clase.js"></script>
</body>
</html>
