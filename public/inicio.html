<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio — Smart Campus IA</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/reloj.css">
</head>
<body>
  <main class="contenido">
    <h1 id="saludo" style="margin:0 0 .25rem;font-size:var(--texto-2xl);color:var(--color-primary)">Inicio</h1>
    <p id="sub" style="color:var(--color-text-muted);margin:0 0 2rem"></p>

    <div id="reloj"></div>

    <div id="tarjetas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem"></div>

    <h2 style="font-size:var(--texto-lg);margin:2rem 0 1rem">Mis clases</h2>
    <div class="tarjeta" style="padding:0;overflow:auto">
      <table class="tabla" id="clases"><tbody><tr><td style="padding:1.5rem;color:var(--color-text-muted)">Cargando…</td></tr></tbody></table>
    </div>
  </main>
  <script type="module" src="/js/inicio.js"></script>
</body>
</html>
