<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — Smart Campus IA</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/tema-init.js"></script>
</head>
<body>
  <main class="pantalla-centrada">
    <div class="tarjeta tarjeta-acceso">
      <div class="marca">
        <img class="logo" src="/img/logo-256.png" alt="Smart Campus IA">
        <h1>Smart Campus <span class="ia">IA</span></h1>
        <p>Sistema de gestión académica y seguridad escolar</p>
      </div>

      <div id="aviso" class="aviso" role="alert" hidden></div>

      <!-- Ingreso -->
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="boton" type="submit" id="btn-entrar">Ingresar</button>
      </form>

      <!-- Cambio obligatorio de contraseña -->
      <form id="form-cambio" novalidate hidden>
        <div class="aviso aviso-info">
          Es tu primer ingreso. Define una contraseña nueva antes de continuar.
        </div>
        <div class="campo">
          <label for="actual">Contraseña actual</label>
          <input id="actual" type="password" autocomplete="current-password" required>
        </div>
        <div class="campo">
          <label for="nueva">Contraseña nueva</label>
          <input id="nueva" type="password" autocomplete="new-password" required>
          <p class="ayuda">Mínimo 10 caracteres, con al menos una letra y un número.</p>
        </div>
        <div class="campo">
          <label for="repetir">Repite la contraseña nueva</label>
          <input id="repetir" type="password" autocomplete="new-password" required>
        </div>
        <button class="boton" type="submit" id="btn-cambiar">Guardar y continuar</button>
      </form>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
