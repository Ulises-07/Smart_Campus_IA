<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumnos — Smart Campus IA</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="contenido">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
      <h1 style="margin:0;font-size:var(--texto-2xl);color:var(--color-primary)">Alumnos</h1>
      <button class="boton" id="btn-nuevo" style="width:auto" hidden>Nuevo alumno</button>
    </div>

    <div class="tarjeta" style="margin-bottom:1rem;padding:1rem">
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:end">
        <div class="campo" style="margin:0;flex:1;min-width:200px">
          <label for="q">Buscar</label>
          <input id="q" placeholder="Nombre, apellido o código">
        </div>
        <div class="campo" style="margin:0;min-width:180px">
          <label for="f-seccion">Sección</label>
          <select id="f-seccion" class="control"><option value="">Todas</option></select>
        </div>
        <button class="boton" id="btn-buscar" style="width:auto">Buscar</button>
      </div>
    </div>

    <div class="tarjeta" style="padding:0;overflow:auto">
      <table class="tabla" id="tabla">
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Grado y sección</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody><tr><td colspan="5" style="padding:1.5rem;color:var(--color-text-muted)">Cargando…</td></tr></tbody>
      </table>
    </div>
    <p id="paginacion" style="color:var(--color-text-muted);font-size:var(--texto-sm)"></p>
  </main>

  <dialog id="dlg" class="dialogo"></dialog>
  <script type="module" src="/js/alumnos.js"></script>
</body>
</html>
